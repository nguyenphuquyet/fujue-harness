[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "quyet-harness-sdk"
version = "0.0.0.dev0"
description = "Python SDK for JueTech Harness"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]
dependencies = [
  "pydantic>=2.12,<3",
  "quyet-harness-runtime-bin==0.0.0.dev0",
]

[project.urls]
Homepage = "https://github.com/nguyenphuquyet/quyet-harness"
Documentation = "https://github.com/nguyenphuquyet/quyet-harness/blob/master/docs/user/guide/python-sdk.md"
Issues = "https://github.com/nguyenphuquyet/quyet-harness/issues"
Source = "https://github.com/nguyenphuquyet/quyet-harness"

[dependency-groups]
test = ["pytest>=8.0", "Pillow==12.3.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/quyet_harness"]
# The release job uses Twine 6.2.0, which accepts core metadata through 2.4.
core-metadata-version = "2.4"

# Editable installs see runtime executables injected after installation instead
# of freezing a wheel snapshot.
[tool.uv.sources]
quyet-harness-runtime-bin = { path = "../sdk-runtime", editable = true }
