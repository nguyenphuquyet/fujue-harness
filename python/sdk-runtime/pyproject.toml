[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "quyet-harness-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled quyet CLI runtime for the JueTech Harness Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/nguyenphuquyet/quyet-harness"
Documentation = "https://github.com/nguyenphuquyet/quyet-harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/nguyenphuquyet/quyet-harness/issues"
Source = "https://github.com/nguyenphuquyet/quyet-harness"

[project.scripts]
quyet = "quyet_harness_runtime:main"

# Include the injected quyet executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/quyet_harness_runtime/runtime/quyet-harness-sdk-runtime-*",
  "src/quyet_harness_runtime/runtime/quyet-harness-sdk-runtime-*/**",
  "src/quyet_harness_runtime/runtime/linux-*/**",
  "src/quyet_harness_runtime/runtime/macos-*/**",
  "src/quyet_harness_runtime/runtime/win-*/**",
]
exclude = ["src/quyet_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/quyet_harness_runtime"]
# The release job uses Twine 6.2.0, which accepts core metadata through 2.4.
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
