- name: '@quyet/llm'
- name: '@quyet/session'
- name: '@quyet/session-projection'
- name: '@quyet/system-prompt'
- name: '@quyet/tools'
- name: '@quyet/tool-executor-native'
- name: '@quyet/agent'
- name: '@quyet/agent-loop'
  config:
    agents: []
- name: '@quyet/credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@quyet/llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@quyet/llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
