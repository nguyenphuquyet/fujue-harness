# The quyet-web-app bundle patch: the browser surface over the quyet-base layer.
# Applied after quyet-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The web-startup plugin injects `cmdlineArgs` and provides `webStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The web-runtime row
# validates the advertised public URL; Connection reads invocation authorities
# directly from `webStartup`.
# `quyet --profile web --help` provides no `webStartup`, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

# Full-text session search is opt-in (the base row's `openAt: never`). This
# restatement keeps the Web values on one ephemeral in-memory index; a
# deployment enabling content search overrides `openAt` to `first-search` in a
# later patch layer, which defers the node:sqlite import and in-memory handle
# to the first search so startup stays quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

# ── web-only host rows, the transport layer, and the browser roster ─────────

# `quyet.client` rows are the browser roster the modules node half scans into
# window.__QUYET_BOOT__; the modules row is simultaneously a host row.
- insert:
    - id: desktop-product-telemetry
      name: '@quyet/host-product-telemetry-otel'
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"
      config:
        scheduledDelayMillis: 30000
        timeoutMillis: 15000
        exportTimeoutMillis: 20000
        shutdownTimeoutMillis: 2000
        serviceName: quyet-harness-desktop
        serviceVersion: !!js process.env.QUYET_CLIENT_VERSION
        endpoint: !!js process.env.QUYET_PRODUCT_ANALYTICS_OTLP_URL

    - id: product-analytics
      name: '@quyet/client-product-analytics'
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"
      config:
        enabled: true
        appVersion: !!js process.env.QUYET_CLIENT_VERSION

    # Host-owned authorization sampled at Agent creation. The Plugins page
    # edits this settings namespace independently of the selected preset.
    - id: subagent-model-selection-settings
      name: '@quyet/tool-subagent/model-selection-settings'

    - id: message-feedback
      name: '@quyet/message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@quyet/session-log-export'

    # Session-menu application choices over Host resolution on macOS, Windows,
    # and Linux. An empty catalog hides the action. The Host routes and browser
    # controls also serve the file-tree directory opener.
    - id: open-in-app
      name: '@quyet/host-open-in-app'
      config:
        probeTimeoutMs: 10000
        iconTimeoutMs: 10000
        launchWatchMs: 1000

    - id: ui-file-actions
      name: '@quyet/client-ui-file-actions'
    - id: ui-context-menu
      name: '@quyet/client-ui-context-menu'
    - id: ui-open-in-app
      name: '@quyet/client-ui-open-in-app'

    - id: workspace
      name: '@quyet/workspace'

    - id: session-reference
      name: '@quyet/session-reference'

    - id: file-reference-local
      name: '@quyet/file-reference-local'

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@quyet/session-stats'

    # Whole-log turn outline for the chat turn rail (the turnOutline
    # projection key): every turn stays navigable before its events page in.
    - id: session-turn-outline
      name: '@quyet/session-turn-outline'

    # Resolve bind host, SSH launch, and display once at boot, then mount the
    # matching dual-face directory picker. Mount -native or -browse directly in
    # an overlay to pin the interaction.
    - id: directory-picker
      name: '@quyet/host-directory-picker-auto'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@quyet/host-plugin-inventory'

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@quyet/api-session-controller'

    # One background job's observation record streamed over Typert Remote;
    # the roster rides the session control stream above.
    - id: job-controller
      name: '@quyet/api-job-controller'
    # Workspace file service: bounded read, directory listing, and the
    # agent-write change feed inside the session workspace root.
    - id: terminal-controller
      name: '@quyet/api-terminal-controller'
    - id: workspace-files
      name: '@quyet/api-workspace-files'

    # The Schedule service owns the task store and delivers each due occurrence
    # as a follow-up to the task's target Session. The clock reading and the four
    # reminder tools belong to the `standard`, `cordis`, and `ptc` presets,
    # which declare them in their own scope.
    - id: schedule
      name: '@quyet/schedule'

    # Configuration-surface reads and writes over Typert Remote. Each method
    # reports an actionable error when its settings-domain provider is absent.
    - id: ui-settings-account
      name: '@quyet/client-ui-settings-account'

    - id: account-controller
      name: '@quyet/api-account-controller'

    - id: settings-controller
      name: '@quyet/api-settings-controller'

    # One shared MCP server fleet: Settings-configured servers plus servers
    # that installed plugins register, with status and recovery over Remote.
    # Credential templates and OAuth grants resolve through the credentials
    # provider, so the manager starts after it.
    - id: mcp-manager
      name: '@quyet/mcp-manager'
      inject: [credentials]

    # Workspace commands and reconnect-safe projection over Typert Remote.
    - id: workspace-controller
      name: '@quyet/api-workspace-controller'

    - id: cordis-host-runner
      name: '@quyet/cordis-host-runner'

    # The Host inspect providers are process-global: the registry rejects a
    # duplicate id, so they register here once and every preset's `tool-cordis`
    # row reads them.
    - id: cordis-inspect-providers
      name: '@quyet/tool-cordis/host'

    # Ordinary provider for the parsed Web flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: web-startup
      name: '@quyet/web-app/startup'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    # Plain route-registration carrier; host and port come from the app's
    # webStartup provider, with these deployment fallbacks. The dist is served
    # by the web-runtime row below through the fallback seat. Routing and
    # browser-facing asset paths do not depend on the advertised URL, which the
    # web-runtime row owns; Connection reads trust authorities from webStartup.
    # This row rejects wildcard binds.
    - id: webserver
      name: '@quyet/host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        tls: !!js ctx.webStartup.tls
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # Web glue owned by this bundle: resolves the built frontend dist (an
    # assembly fact of quyet-web-app, never user config), mounts the
    # frontend-static fallback owner, registers the bash runtime variable,
    # prints the URL line, and opens the canonical URL after the full Loader
    # tree settles and the required-entry audit passes. Invocation-only values
    # come from the webStartup provider; the advertised application URL is
    # this row's `publicUrl`, otherwise the bind-address URL.
    - id: web-runtime
      name: '@quyet/web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        publicUrl: !!js ctx.webStartup.publicUrl
        surfaceContext: true

    # Model context for an agent that inspects or extends the harness serving
    # this GUI: value-free prompt sections plus the current checkout and GUI
    # URL as optional runtime context. A complete agent-preset persona replaces
    # the sections, and a persona that suppresses optional runtime context
    # also drops the two value lines.
    - id: harness-dev-context
      name: '@quyet/harness-dev-context'

    # The client-plugin reload chain, always mounted: it is idle until a
    # rebuild watcher (pnpm run dev:web) actually rewrites client bundles. It
    # is a row rather than a child of web-runtime because its node half is a
    # client-side package, which a host-side bundle cannot import.
    - id: client-hmr
      name: '@quyet/client-hmr'

    # ── browser plugin roster (quyet.client rows; node halves are layer-2 hosts) ──

    # Dual-face: the node half scans this tree, composes window.__QUYET_BOOT__,
    # and serves /plugins/<id>/client.js; the browser half is the module table
    # the shell kernel constructs before cordis exists (adopted as a plugin
    # entry by the kernel, never fetched).
    - id: modules
      name: '@quyet/client-modules'

    # Owns both ends of the web transport: node half binds the gateway to the
    # webserver under /api; browser half is the fetch/SSE client. Every API
    # request and upgrade passes the loopback, listener-bind, or trustedHosts
    # policy; an advertised public URL contributes nothing to it.
    - id: connection
      name: '@quyet/client-connection'
      inject: [webStartup]
      config:
        # Keep invocation authorities (each --trusted-host value) when adding
        # deployment values, for example: ['app.internal', ...ctx.webStartup.trustedHosts].
        # The listener's bind IP is accepted separately from this list.
        trustedHosts: !!js ctx.webStartup.trustedHosts

    # Raw Blob and ReadableStream uploads run independently of Connection's
    # RPC and generation service.
    - id: file-upload
      name: '@quyet/client-file-upload'

    - id: api-remotes
      name: '@quyet/api-remotes'

    - id: cordis-client-runner
      name: '@quyet/cordis-client-runner'

    - id: ui-theme
      name: '@quyet/client-ui-theme'

    - id: locale
      name: '@quyet/client-locale'

    - id: shortcuts
      name: '@quyet/client-shortcuts'

    - id: ui-shortcuts
      name: '@quyet/client-ui-shortcuts'

    - id: ui-layout
      name: '@quyet/client-ui-layout'

    - id: ui-renderer
      name: '@quyet/client-ui-renderer'

    - id: ui-session
      name: '@quyet/client-ui-session'

    # Unified resource model: protocol providers behind the useResource hook.
    - id: resources
      name: '@quyet/client-resources'

    - id: ui-sidebar
      name: '@quyet/client-ui-sidebar'

    # The right Sidebar: one docking surface per session over ui-dockkit.
    - id: ui-sidebar-right
      name: '@quyet/client-ui-sidebar-right'


    - id: office-to-pdf
      name: '@quyet/office-to-pdf'

    # The right Sidebar's document tab: bounded file reads with selectable
    # Markdown, code, HTML, PDF, Office, and plain-text renderers.
    - id: ui-sidebar-documentpreview
      name: '@quyet/client-ui-sidebar-documentpreview'

    # Web profiles opt in; Desktop retains sandboxed HTTP(S) Browser tabs.
    - id: ui-sidebar-browser
      name: '@quyet/client-ui-sidebar-browser'
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"

    - id: ui-sidebar-terminal
      name: '@quyet/client-ui-sidebar-terminal'
    # The right Sidebar's workspace file tree tab type.
    - id: ui-sidebar-files
      name: '@quyet/client-ui-sidebar-files'

    - id: ui-settings
      name: '@quyet/client-ui-settings'

    - id: ui-settings-general
      name: '@quyet/client-ui-settings-general'

    - id: ui-settings-models
      name: '@quyet/client-ui-settings-models'

    # Plugin management: the sidebar Plugins page installs, enables, disables,
    # and removes the profile's bundles through the `pluginManager` Remote.
    # Without a profile-backed Host it reports itself unavailable.
    - id: ui-plugin-manager
      name: '@quyet/client-ui-plugin-manager'

    # Read-only Plugin list tab in the Settings Plugins section; the built-in
    # bundles the sidebar page leaves out are inspected here.
    - id: ui-settings-plugin-inventory
      name: '@quyet/client-ui-settings-plugin-inventory'

    - id: ui-conversation
      name: '@quyet/client-ui-conversation'

    - id: ui-approval
      name: '@quyet/client-ui-approval'

    - id: message-quotes
      name: '@quyet/message-quotes'

    - id: ui-chat
      name: '@quyet/client-ui-chat'

    # Official occupants for the sidebar brand slots and the home whale frame layer.
    - id: ui-brand-official
      name: '@quyet/client-ui-brand-official'

    - id: ui-attachment
      name: '@quyet/client-ui-attachment'

    - id: ui-file-drag
      name: '@quyet/client-ui-file-drag'

    # Tool call tree, generic fallback, and keyed business Tool views.
    - id: ui-tool
      name: '@quyet/client-ui-tool'

    - id: ui-cordis
      name: '@quyet/client-ui-cordis'

    - id: deliverable-file-references
      name: '@quyet/deliverable-file-references'

    # Turn tail: the changed-files card and delivery cards under each closing
    # assistant message. Remove this entry to turn the surface off; the tail
    # hole renders empty.
    - id: ui-deliverables
      name: '@quyet/client-ui-deliverables'

    # Records each top-level turn's changed files from git working-tree
    # snapshots; the changed-files card above renders its events.
    - id: workspace-changes
      name: '@quyet/workspace-changes'


    - id: ui-workspace
      name: '@quyet/client-ui-workspace'

    # Durable workflow lifecycle as an independent Chat node after the
    # existing generic workflow tool row.
    - id: ui-workflow-run
      name: '@quyet/client-ui-workflow-run'

    # Input triggers: the '/' | '@' pipeline (ui-input-trigger), the command surface over
    # it (ui-commands), and the reference sources (ui-skill / ui-reference).
    - id: ui-input-trigger
      name: '@quyet/client-ui-input-trigger'

    - id: ui-commands
      name: '@quyet/client-ui-commands'

    - id: ui-skill
      name: '@quyet/client-ui-skill'

    - id: ui-agent-team
      name: '@quyet/client-ui-agent-team'

    - id: ui-subagent
      name: '@quyet/client-ui-subagent'

    - id: ui-reference
      name: '@quyet/client-ui-reference'

    # Display masking for recognized credentials in sent user text; remove
    # this entry to draw credentials as written.
    - id: ui-secret-mask
      name: '@quyet/client-ui-secret-mask'

    # Background jobs: the session-header roster with on-demand streaming
    # record panels over the session job-output service.
    - id: ui-jobs
      name: '@quyet/client-ui-jobs'

    # Task management and Session reminder catalog over the Host Schedule
    # service mounted above.
    - id: ui-schedule
      name: '@quyet/client-ui-schedule'

    # Goal surface: GoalBar in the input dock over the goal session projection.
    - id: ui-goal
      name: '@quyet/client-ui-goal'

    # The feedback surface: Like/Dislike in the assistant-message action
    # strip, the feedback dialog behind Dislike and /feedback with its
    # acknowledgement toast, over the messageFeedback and sessionFeedback Remotes.
    - id: ui-message-feedback
      name: '@quyet/client-ui-message-feedback'

    # Model selection: the /model popupSelect + composer seat over session.models.
    - id: ui-model-selection
      name: '@quyet/client-ui-model-selection'

    - id: ui-permission
      name: '@quyet/client-ui-permission-presets'

    # The agent-preset row in General settings: the default preset for
    # sessions created later. Absent a roster it renders nothing.
    - id: ui-agent-preset
      name: '@quyet/client-ui-agent-preset'

    # Region-local More menus: pin or unpin plugin launchers and start a
    # plugin draft.
    - id: entry-customization
      name: '@quyet/client-ui-entry-customization'

    - id: ui-settings-session-log
      name: '@quyet/client-ui-settings-session-log'

    # The Built-in plugins settings section: the navigation entry and the tab
    # row the inventory tab registers into. The official configuration pages
    # are the companion rows below.
    - id: ui-settings-plugins
      name: '@quyet/client-ui-settings-plugins'

    # The official settings pages: one companion package per host-plane
    # namespace, each registering its page into the Plugins page while the
    # Host serves the namespace.
    - id: ui-settings-shell
      name: '@quyet/client-ui-settings-shell'

    - id: ui-settings-agent-loop
      name: '@quyet/client-ui-settings-agent-loop'

    - id: ui-settings-subagent
      name: '@quyet/client-ui-settings-subagent'

    - id: ui-settings-web-search
      name: '@quyet/client-ui-settings-web-search'

    # Plan control: the composer plan seat over the plan projection + /plan channel.
    - id: ui-plan
      name: '@quyet/client-ui-plan'

    - id: ui-user-questions
      name: '@quyet/client-ui-user-questions'

    - id: ui-trajectory
      name: '@quyet/client-ui-trajectory'

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools, its prompt sections, its delegation backends. The base keeps them
# for the TUI, which is single-session and composes its agent process-wide; the
# Web surface disables them here and lets each session mount a preset instead.
#
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear the day someone reorders
# the composition.

# `shell-env` STAYS in the host plane: `apps/cli/src/web.ts` injects it to
# publish `QUYET_WEB_URL`/`QUYET_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# would never reach the model's shell at all.

- id: tool-plugin-manager
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# The background-job REGISTRY stays on the host plane; only the model-facing
# `job_*` controls move. Its producers — `tool-bash` here and `tool-terminal`
# elsewhere — are preset rows that resolve it
# with `ctx.get`, and an entry-local realm around the registry is invisible to
# every sibling row outside that realm, so `run_in_background` answered
# "background jobs unavailable" while the controls sat in the catalog. That is
# the `goals` criterion read from inside the preset: a Service a row outside its
# realm READS belongs to the plane both can see. The registry is keyed by owning
# agent, so one host instance serves every session exactly as before presets.

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

# The `skill` REGISTRY stays in the host plane. It is host+per-scope layered
# (the tools-registry shape): deployment-level providers — repository plugins,
# a host skill-filesystem row — register into its global layer, while a preset's
# `skill-filesystem` registers into that preset's layer, and each agent reads the
# merged catalog its scope chain selects. Only the per-agent rows move behind
# presets: the base host `skill-filesystem` row is disabled here (presets own local
# discovery), and `tool-skill` is what a preset mounts to give its agent the
# catalog and loader at all.

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

# The goal service and session driver stay on the host plane, where Gateway
# remotes resolve them. Presets own the human command and model-facing tool.

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

# The token METER stays on the host plane; only the compaction backend that
# reads it moves. It owns the context-meter projection units, and that table is
# process-wide, so preset ownership would make the meter a function of which
# presets happen to be mounted rather than a per-session fact. Same criterion as
# `tasks` and `goals`; the reasoning has one home in
# `.agents/notes/implemented/architecture/2026-08-10-host-plane-ownership-after-presets.md`.

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# The subagent registry and its backends belong in the host composition: browser
# prompt and interrupt requests share its runtime, and provider names are unique
# within the registry. Presets select the delegation tools visible to each Agent.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# The preset selection registry. The shipped preset declarations follow as
# separate patch files under `presets/`, listed after this file in
# `package.json` `quyet.bundle.patch`.
- insert:
    - id: agent-preset-registry
      name: '@quyet/agent-preset-registry'
      config:
        default: standard
