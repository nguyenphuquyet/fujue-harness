# PTC mode adds `ctx.ptcRuntime` and changes the registry to one wire tool,
# `run_code`, plus its generated TypeScript SDK prompt. The demo and snapshot
# recorder apply this profile patch; replay applies its sibling patch.
- insert:
    - id: literal-sdk
      name: '../../../packages/core/tools/tests/fixtures/literal-sdk.ts'

- id: agent-default-model
  name: '@quyet/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@quyet/session-persistence-jsonl'
  config:
    root: !!js quyetHomePath('sessions')
    compression: !!js 'process.env.QUYET_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@quyet/agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: true

- id: tool-executor-ptc
  disabled: false

- id: system-prompt
  name: '@quyet/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
