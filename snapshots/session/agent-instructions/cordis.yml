# Workspace-context snapshot patch: the harness exports QUYET_HOME=<cwd>/.quyet and
# QUYET_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@quyet/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@quyet/session-persistence-jsonl'
  config:
    root: !!js quyetHomePath('sessions')
    compression: !!js 'process.env.QUYET_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@quyet/agent-instructions'
  config:
    maxBytes: 65536
    projectRootMarkers:
      - .quyet-project

- id: system-prompt
  name: '@quyet/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
