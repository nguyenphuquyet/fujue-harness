# Minimal live counterpart for the apply-patch snapshot composition.
- id: llm-deepseek
  name: '@quyet/llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@quyet/subprocess-local'

- id: agent-default-model
  name: '@quyet/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@quyet/session-persistence-jsonl'
  config:
    root: !!js quyetHomePath('sessions')
    compression: !!js 'process.env.QUYET_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@quyet/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@quyet/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@quyet/tool-jobs'
  disabled: true

- id: goal
  name: '@quyet/goal'
  disabled: true

- id: goal-round-driver
  name: '@quyet/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@quyet/command-goal'
  disabled: true

- id: tool-goal
  name: '@quyet/tool-goal'
  disabled: true

- id: skill
  name: '@quyet/skill'
  disabled: true

- id: skill-filesystem
  name: '@quyet/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@quyet/tool-skill'
  disabled: true

- id: tool-fs

- id: spill-local
  name: '@quyet/spill-local'
  config:
    root: !!js process.env.QUYET_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.QUYET_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.QUYET_SNAPSHOT_SPILL_LOCATOR_ROOT
