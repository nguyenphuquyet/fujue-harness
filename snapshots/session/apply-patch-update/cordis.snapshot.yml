# Minimal keyless composition: real app and filesystem tools; replayed model.
- id: llm-deepseek
  name: '@quyet/llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@quyet/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: high

- id: subprocess
  name: '@quyet/subprocess-local'

- id: agent-default-model
  name: '@quyet/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@quyet/session-persistence-jsonl'
  config:
    root: !!js quyetHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@quyet/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@quyet/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@quyet/tool-jobs'
  disabled: true

- id: goal
  name: '@quyet/goal'
  disabled: true

- id: goal-round-driver
  name: '@quyet/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@quyet/command-goal'
  disabled: true

- id: tool-goal
  name: '@quyet/tool-goal'
  disabled: true

- id: skill
  name: '@quyet/skill'
  disabled: true

- id: skill-filesystem
  name: '@quyet/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@quyet/tool-skill'
  disabled: true

- id: tool-fs

- id: spill-local
  name: '@quyet/spill-local'
  config:
    root: !!js process.env.QUYET_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.QUYET_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.QUYET_SNAPSHOT_SPILL_LOCATOR_ROOT
