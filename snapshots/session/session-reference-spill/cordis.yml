- id: spill-local
  name: '@quyet/spill-local'
  config:
    root: !!js process.env.QUYET_SNAPSHOT_SPILL_ROOT ?? './.spill'
    cleanupPeriodDays: 0

- insert:
    - id: session-reference
      name: '@quyet/session-reference'
      config:
        maxReferenceBytes: 360
    - id: reference-source-fixture
      name: ../../../packages/context/session-reference/tests/fixtures/source-session.ts

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.QUYET_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.QUYET_SNAPSHOT_SPILL_LOCATOR_ROOT
