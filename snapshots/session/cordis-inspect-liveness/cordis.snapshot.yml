- id: llm-deepseek
  name: '@quyet/llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@quyet/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@quyet/session-persistence-jsonl'
  config:
    root: !!js quyetHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@quyet/agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: false

- id: tool-executor-ptc
  disabled: true

- id: system-prompt
  name: '@quyet/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@quyet/cordis-host-runner'
      config:
        clientInspectTimeoutMs: 100
    - id: cordis-inspect-providers
      name: '@quyet/tool-cordis/host'
    - id: tool-cordis
      name: '@quyet/tool-cordis'
    - id: llm-replay
      name: '@quyet/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: client-inspect-liveness-fixture
      name: ./client-fixture.mjs
