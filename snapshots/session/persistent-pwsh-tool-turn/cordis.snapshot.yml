# Keyless replay counterpart to persistent-pwsh.cordis.yml.
- id: llm-deepseek
  name: '@quyet/llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@quyet/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- insert:
    - id: terminal
      name: '@quyet/terminal'

- id: sandbox-policy
  name: '@quyet/sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@quyet/subprocess-local'

- insert:
    - id: terminal-pwsh
      name: '@quyet/terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 30000

- id: agent-default-model
  name: '@quyet/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@quyet/session-persistence-jsonl'
  config:
    root: !!js quyetHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@quyet/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@quyet/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@quyet/tool-jobs'
  disabled: true

- id: goal
  name: '@quyet/goal'
  disabled: true

- id: goal-round-driver
  name: '@quyet/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@quyet/command-goal'
  disabled: true

- id: tool-goal
  name: '@quyet/tool-goal'
  disabled: true

- id: skill
  name: '@quyet/skill'
  disabled: true

- id: skill-filesystem
  name: '@quyet/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@quyet/tool-skill'
  disabled: true

- id: tool-bash
  name: '@quyet/tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@quyet/tool-pwsh-persistent'
