# TypeScript SDK snapshot-record patch over `quyet --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@quyet/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@quyet/llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@quyet/session-persistence-jsonl'
  config:
    root: !!js quyetHomePath('sessions')
    compression: !!js "process.env.QUYET_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@quyet/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- insert:
    - id: agent-team
      name: '@quyet/agent-team'
    - id: tool-agent-team
      name: '@quyet/tool-agent-team'
    - id: team-session-mode-fixture
      name: ../../../packages/team/agent-team/tests/session-mode-fixture.ts
